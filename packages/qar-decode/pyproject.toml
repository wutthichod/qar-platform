[project]
name = "qar-decode"
version = "0.1.0"
description = "ARINC 717 decoding. Pure domain logic — no cloud dependencies."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Arrow output. Kept optional so the core stays numpy-only and the import
# boundary test has less to police.
arrow = ["pyarrow>=16.0"]
dev = ["pytest>=8", "pyarrow>=16.0"]

[project.scripts]
qar-decode = "qar_decode.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qar_decode"]
