[project]
name = "qar-client"
version = "0.1.0"
description = "Analyst-facing client. Flight-level verbs over Arrow."
requires-python = ">=3.11"
dependencies = ["pyarrow>=16", "pandas>=2.0", "boto3>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qar_client"]
